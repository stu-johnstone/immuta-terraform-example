# Brian: users whose BusinessUnit attribute is Insurance get that business's
# curated (silver and gold) tables. When the attribute changes, access changes
# with it; the policy does not.
name: Insurance business unit access
policyKey: subscription business unit insurance
type: subscription
actions:
  type: entitlements
  entitlements:
    operator: any
    attributes:
      - name: BusinessUnit
        value: Insurance
  automaticSubscription: true
  allowDiscovery: false
  description: Insurance users get Insurance curated tables, limited to their region.
circumstanceOperator: all
circumstances:
  # Scoped to the Insurance domain, which holds the data sources tagged
  # "Business Unit.Insurance" (see domains.tf). The other policies are global.
  - type: domains
    domains:
      - name: Insurance
  - type: columnTags
    columnTag: Data.Region
