# Brian: users whose BusinessUnit attribute is Retail Banking get that business's
# curated (silver and gold) tables. When the attribute changes, access changes
# with it; the policy does not.
name: Retail Banking business unit access
policyKey: subscription business unit retail banking
type: subscription
actions:
  type: entitlements
  entitlements:
    operator: any
    attributes:
      - name: BusinessUnit
        value: Retail Banking
  automaticSubscription: true
  allowDiscovery: false
  description: Retail Banking users get Retail Banking curated tables, limited to their region.
circumstanceOperator: all
circumstances:
  - type: tags
    tag: Business Unit.Retail Banking
  - type: columnTags
    columnTag: Data.Region
