[project]
name = "datagen"
version = "0.1.0"
description = "Generates the Immuta demo data (DDL and data) for each platform."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
datagen = "datagen.cli:main"

[dependency-groups]
# duckdb runs the generated SQL in tests; sqlglot syntax-checks each platform.
dev = ["pytest>=8", "duckdb>=1.1", "sqlglot>=25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagen"]
