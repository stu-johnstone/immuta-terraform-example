  name: Engineering Subscription
  policyKey: subscription engineering advanced
  type: subscription

  actions:
    type: entitlements

    advanced: >
      @isInGroups('Engineers', 'Data Platform')
      AND @hasAttribute('region', 'APAC')

    automaticSubscription: true
    allowDiscovery: false

    description: >
      Grant access only to APAC users who belong to Engineers
      or Data Platform.

  circumstances:
    - type: tags
      tag: Business.Curated

  staged: true